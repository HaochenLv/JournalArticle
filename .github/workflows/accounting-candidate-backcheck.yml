name: Accounting Candidate Back-Check

on:
  push:
    branches:
      - aiccc-journal-rebuild
    paths:
      - "scripts/accounting_candidate_backcheck.py"
      - "config/accounting_candidate_backcheck.json"
      - ".github/workflows/accounting-candidate-backcheck.yml"

permissions:
  contents: read

concurrency:
  group: journal-accounting-candidate-backcheck
  cancel-in-progress: true

jobs:
  backcheck:
    if: github.repository == 'HaochenLv/JournalArticle' && github.ref == 'refs/heads/aiccc-journal-rebuild'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false
      - name: Locate local Python 3.12
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path ".venv\Scripts\python.exe") {
            $python = (Resolve-Path ".venv\Scripts\python.exe").Path
          } else {
            $python = $null
            $py = Get-Command py.exe -ErrorAction SilentlyContinue
            if ($py) {
              $candidate = & $py.Source -3.12 -c "import sys; print(sys.executable)" 2>$null
              if ($LASTEXITCODE -eq 0 -and $candidate) { $python = ($candidate | Select-Object -Last 1).Trim() }
            }
            if (-not $python) {
              $candidates = @("C:\Python312\python.exe","C:\Program Files\Python312\python.exe")
              $candidates += @(Get-ChildItem "C:\Users\*\AppData\Local\Programs\Python\Python312\python.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
              foreach ($candidate in $candidates) {
                if (-not (Test-Path $candidate)) { continue }
                & $candidate -c "import sys; assert sys.version_info[:2] == (3, 12)" 2>$null
                if ($LASTEXITCODE -eq 0) { $python = $candidate; break }
              }
            }
            if (-not $python) { throw "No accessible Python 3.12 installation was found." }
            & $python -m venv .venv
            $python = (Resolve-Path ".venv\Scripts\python.exe").Path
          }
          "JOURNAL_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python --version
      - name: Prepare pinned environment
        run: |
          & $env:JOURNAL_PYTHON -m pip install --disable-pip-version-check -r requirements.txt
          & $env:JOURNAL_PYTHON -m pip check
          if (-not (Test-Path ".deps\evaluator") -or -not (Test-Path ".deps\helix")) {
            & $env:JOURNAL_PYTHON scripts\bootstrap.py
          } else {
            Write-Host "Pinned .deps already present; reusing them."
          }
      - name: Run diagnostic back-check
        run: |
          & $env:JOURNAL_PYTHON scripts\accounting_candidate_backcheck.py
      - name: Upload result
        if: always() && hashFiles('results/accounting_candidate_backcheck/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: accounting-candidate-backcheck
          path: results/accounting_candidate_backcheck/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Scope guard
        if: always()
        run: |
          Write-Host "Diagnostic design-set back-check only."
          Write-Host "No HELIX execution and no claim of held-out confirmation."
