name: TTFT Compute-Contention Abstention

on:
  push:
    branches:
      - aiccc-journal-rebuild
    paths:
      - "scripts/ttft_compute_contention_abstention.py"
      - "config/ttft_compute_contention_abstention_v1.json"
      - ".github/workflows/ttft-compute-contention-abstention.yml"

permissions:
  contents: read

concurrency:
  group: journal-ttft-contention-abstention
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.repository == 'HaochenLv/JournalArticle' && github.ref == 'refs/heads/aiccc-journal-rebuild'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false
      - name: Locate Python
        run: |
          if (Test-Path ".venv\Scripts\python.exe") {
            $python=(Resolve-Path ".venv\Scripts\python.exe").Path
          } else {
            $py=Get-Command py.exe -ErrorAction Stop
            $python=(& $py.Source -3.12 -c "import sys;print(sys.executable)" | Select-Object -Last 1).Trim()
            & $python -m venv .venv
            $python=(Resolve-Path ".venv\Scripts\python.exe").Path
          }
          "JOURNAL_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare environment
        run: |
          & $env:JOURNAL_PYTHON -m pip install --disable-pip-version-check -r requirements.txt
          if (-not (Test-Path ".deps\evaluator") -or -not (Test-Path ".deps\helix")) {
            & $env:JOURNAL_PYTHON scripts\bootstrap.py
          }
      - name: Run frozen evaluator guards
        run: |
          & $env:JOURNAL_PYTHON -m unittest tests.test_aiccc_math -v
          & $env:JOURNAL_PYTHON -m unittest tests.test_aiccc_evaluator -v
          & $env:JOURNAL_PYTHON -m unittest tests.test_aiccc_j1_evaluator -v
      - name: Evaluate contention abstention
        run: |
          & $env:JOURNAL_PYTHON scripts\ttft_compute_contention_abstention.py
      - name: Upload result
        if: always() && hashFiles('results/ttft_compute_contention_abstention_v1/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ttft-compute-contention-abstention-v1
          path: results/ttft_compute_contention_abstention_v1/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Scope guard
        if: always()
        run: |
          Write-Host "Tri-state accounting guard only; J0/J1 are unchanged."
          Write-Host "No new HELIX run and no fitted latency margin."
